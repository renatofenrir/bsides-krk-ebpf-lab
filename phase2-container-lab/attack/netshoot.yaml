# The attacker workload. nicolaka/netshoot ships nmap, curl, nc, tcpdump and
# dig already installed, which is exactly the toolkit the Phase 2 policies are
# written against.
apiVersion: v1
kind: Namespace
metadata:
  name: tetragon-demo
---
apiVersion: v1
kind: Pod
metadata:
  name: attacker
  namespace: tetragon-demo
  labels:
    app: attacker
spec:
  # Restart policy matters here. Every successful mitigation SIGKILLs a
  # process; if that process were PID 1 the pod would restart and the demo
  # would lose its shell mid-sentence. Sleeping as PID 1 and running the
  # attacks via `kubectl exec` keeps the pod alive across kills.
  restartPolicy: Always
  containers:
    - name: netshoot
      image: nicolaka/netshoot:latest
      # Explicit, because Kubernetes defaults an implicit `:latest` tag to
      # Always -- meaning every `make lab-reset` re-pulls from Docker Hub
      # live, even when the exact image is already cached on this node from
      # a previous pull. Measured 2026-09-25: a TLS handshake timeout to
      # registry-1.docker.io took down a rehearsal for exactly this reason.
      # Once cached, IfNotPresent means resets never touch the network again.
      imagePullPolicy: IfNotPresent
      command: ["sleep", "infinity"]
      securityContext:
        capabilities:
          # NET_RAW and NET_ADMIN so nmap -sS and tcpdump can actually attempt
          # what the policies are meant to stop. Without these the attacks
          # fail on permissions and the demo proves nothing -- the audience
          # sees a denial, but from the container runtime, not from eBPF.
          add: ["NET_RAW", "NET_ADMIN"]
  # Attacker on the worker, victim on the (untainted) control plane, so every
  # flow between them crosses a node boundary and Hubble has something to draw.
  # On a two-node cluster these two hostnames are the whole topology.
  nodeSelector:
    kubernetes.io/hostname: k8s-worker-0-bsides-krk-demo
  # Ride out a brief node blip instead of being evicted. This is a bare Pod
  # (no controller), so the default 300s not-ready/unreachable eviction deletes
  # it for good and every `kubectl exec` attack silently breaks mid-talk --
  # which is what happened on 2026-09-26 when worker-0 lost its kubelet
  # heartbeat for ~11 min (a fabric hiccup, not resource pressure: the node was
  # at 1% CPU / 22% RAM). 30 min outlasts a 45-min slot's worst transient.
  # Specifying these keys suppresses Kubernetes' default 300s tolerations.
  tolerations:
    - {key: node.kubernetes.io/not-ready,   operator: Exists, effect: NoExecute, tolerationSeconds: 1800}
    - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 1800}
---
# A harmless in-cluster target for the "allowed traffic still works" beat.
apiVersion: v1
kind: Pod
metadata:
  name: victim
  namespace: tetragon-demo
  labels:
    app: victim
spec:
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      # Explicit for the same reason as the attacker pod, though this one's
      # already the default: a pinned (non-`:latest`) tag defaults to
      # IfNotPresent anyway.
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 80
  nodeSelector:
    kubernetes.io/hostname: k8s-master-0-bsides-krk-demo
  # Same reasoning as the attacker pod: keep the demo target alive through a
  # brief control-plane blip rather than losing the "allowed traffic still
  # works" beat to a 300s eviction.
  tolerations:
    - {key: node.kubernetes.io/not-ready,   operator: Exists, effect: NoExecute, tolerationSeconds: 1800}
    - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 1800}
---
apiVersion: v1
kind: Service
metadata:
  name: victim
  namespace: tetragon-demo
spec:
  selector:
    app: victim
  ports:
    - port: 80
      targetPort: 80
