# ---------------------------------------------------------------------------
# Kubespray variables for the BSides lab
# ---------------------------------------------------------------------------

# --- CNI: none. Cilium is installed afterwards, by hand, on stage. ---------
#
# The prod repo lets Kubespray install Cilium via `-e @cilium-extra-vars.yml`.
# This lab does not, for two reasons:
#
#   1. The talk's whole Phase 1 is the `cilium install --set ...` line. Burying
#      it inside a 20-minute Kubespray run means the audience never sees it.
#   2. ipam.mode cannot be changed after the fact. Letting Kubespray install
#      Cilium with its cluster-pool default and then "fixing" it to
#      ipam.mode=kubernetes does not work -- it needs to be right at install.
#
# Consequence: after Kubespray finishes, every node is NotReady and CoreDNS is
# Pending. That is expected. `cilium install` is what makes them Ready.
kube_network_plugin: cni
kube_network_plugin_multus: false

# --- kube-proxy: removed. Cilium replaces it in eBPF. ---------------------
kube_proxy_remove: true

# --- CIDRs, pinned explicitly ---------------------------------------------
#
# These are Kubespray's defaults, but they are written out here because the
# monitor-network-activity-outside-cluster-cidr-range TracingPolicy in Phase 2
# hard-codes them. If you change either value, change
# phase2-container-lab/policies/00-monitor-outside-cluster-cidr.yaml to match
# or the policy will flag every in-cluster connection as suspicious.
#
# NOTE: the upstream reference lab was Kind-based and used 10.244.0.0/16.
# Those numbers do not apply here.
kube_pods_subnet: 10.233.64.0/18
kube_service_addresses: 10.233.0.0/18

# No leading "v": Kubespray v2.31 compares this numerically and crashes on it
# ("'<' not supported between instances of 'str' and 'int'").
#
# Matches prod exactly: bifrost-prod-v4 runs Kubernetes 1.35.4 (Kubespray
# v2.31.0's default) with Cilium 1.18.1 (CILIUM_VERSION in .gitlab-ci.yml).
# Kubespray v2.31.0 only has checksums for 1.33.0 through 1.35.4.
kube_version: 1.35.4

# --- DNS ------------------------------------------------------------------
upstream_dns_servers:
  - 192.0.2.168
  - 8.8.8.8

# --- Lab conveniences -----------------------------------------------------
# Pull the kubeconfig back to inventory/artifacts/ so the operator laptop can
# drive the cluster without SSHing to the master mid-talk.
kubeconfig_localhost: true
kubectl_localhost: true

# --- Two-node specifics ---------------------------------------------------
#
# One control plane, one worker, and the control plane also carries workloads.
# Kubespray still taints it NoSchedule at the end of cluster.yml; the untaint
# is a separate explicit step (`make untaint`) rather than a var, so it is
# visible in the run rather than buried in a role.
#
# supplementary_addresses_in_ssl_keys puts the node IP in the apiserver cert
# so a kubeconfig pointed at 10.1.1.40:6443 (rather than the ClusterIP) does
# not fail TLS verification. With kube-proxy removed, the node IP is the only
# address that works before Cilium is up.
supplementary_addresses_in_ssl_keys:
  - 10.1.1.40

# A single etcd member. Kubespray warns about even-numbered/no-quorum etcd
# clusters; for a lab that is rebuilt before every talk, one member is the
# right trade and the warning is expected.
etcd_deployment_type: host
