# BSides Kraków eBPF lab inventory -- TWO nodes.
#
# These hosts are NOT prod. Prod lives in k8s-playground-bootstrapper on
# 10.1.1.50-52 / .60-.64 / .90-.93 and is named *-bifrost-prod-v4. If you ever
# see a bifrost-prod hostname in this file, stop and fix it before running
# anything.
#
# The control plane is listed in kube_node as well as kube_control_plane. That
# is what makes it a schedulable worker; combined with the untaint step after
# bootstrap, it gives two workload-carrying nodes out of two VMs.

[kube_control_plane]
k8s-master-0-bsides-krk-demo ansible_host=10.1.1.40

[etcd]
k8s-master-0-bsides-krk-demo ansible_host=10.1.1.40

[kube_node]
k8s-master-0-bsides-krk-demo ansible_host=10.1.1.40
k8s-worker-0-bsides-krk-demo ansible_host=10.1.1.41

[k8s_cluster:children]
kube_control_plane
kube_node
