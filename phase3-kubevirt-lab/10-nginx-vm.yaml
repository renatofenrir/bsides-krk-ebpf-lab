# ===========================================================================
# PHASE 3 -- VALIDATED 2026-09-21/22, hardened 2026-09-23/24. Core of the
# live talk -- see LAB_GUIDE.md §3.
#
# An Ubuntu VM running nginx, serving three paths. Only `/details` is used in
# the live talk (beat 1). `/` and `/secret` are leftovers from the original
# reference lab's L4/L7 CiliumNetworkPolicy demo (60-cnp-l7.yaml), which is
# parked (needs the Gateway, off in this cluster) and not part of the talk:
#
#   /          stock nginx welcome page   -> always 200, nothing enforces on it
#   /details   VM name, IP, locale        -> beat 1's target
#   /secret    the flag                   -> always 200 too, UNLESS 60-cnp-l7.yaml
#                                             is applied by hand (see its own header)
#
# The /details output is shaped to match the original reference lab, which
# rendered: <h1>VMDetails</h1><p>Name: ...</p><p>IP: ...</p><p>Locale: ...</p>
# ===========================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: kubevirt-demo
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: nginx-vm
  namespace: kubevirt-demo
  labels:
    app: nginx
spec:
  running: true
  template:
    metadata:
      labels:
        # These labels land on the virt-launcher POD, which is what
        # CiliumNetworkPolicy and Tetragon actually select on. The VM is a
        # workload like any other as far as the datapath is concerned -- that
        # is the point of the whole section.
        app: nginx
        kubevirt.io/vm: nginx-vm
    spec:
      domain:
        cpu:
          cores: 1
        resources:
          requests:
            memory: 1536M
        devices:
          disks:
            - name: containerdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            # masquerade puts the guest behind NAT inside the virt-launcher
            # pod's netns. The guest sees 10.0.2.2; the cluster sees the pod
            # IP. This is what makes the VM addressable by a normal Service
            # and selectable by a normal network policy.
            #
            # It is also why socketLB.hostNamespaceOnly=true is set on Cilium
            # back in Phase 1: without it, socket-level load balancing rewrites
            # connections inside that netns and this binding misbehaves.
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: containerdisk
          containerDisk:
            image: quay.io/containerdisks/ubuntu:24.04
        - name: cloudinitdisk
          cloudInitNoCloud:
            # KubeVirt caps INLINE userData at 2048 bytes, and this cloud-config
            # is ~4.5 KB (nginx setup + the Phase 2 toolkit + Tetragon in the
            # guest), so it lives in a Secret instead. Create/update it from
            # cloud-init/nginx-vm-user-data.yaml -- `make kubevirt` does this,
            # or by hand:
            #   kubectl -n kubevirt-demo create secret generic nginx-vm-cloudinit \
            #     --from-file=userdata=phase3-kubevirt-lab/cloud-init/nginx-vm-user-data.yaml \
            #     --dry-run=client -o yaml | kubectl apply -f -
            # Editing the file alone changes nothing until the Secret is
            # updated AND the VM restarted.
            # Field is `secretRef` (it holds the *userdata* secret);
            # `userDataSecretRef` is rejected by the API.
            secretRef:
              name: nginx-vm-cloudinit
