# PHASE 3 -- VALIDATED 2026-09-21/22. Core of the live talk -- see
# LAB_GUIDE.md §3.
#
# The in-cluster client for beat 1's Service check (LAB_GUIDE.md §3.1) and,
# optionally, as the ssh jump host to the guest if you have the matching
# private key (§3.0's fallback path -- the primary path is `virtctl console`,
# which needs no jump host at all).
apiVersion: v1
kind: Pod
metadata:
  name: tmp-client
  namespace: kubevirt-demo
  labels:
    app: tmp-client
spec:
  containers:
    - name: client
      image: nicolaka/netshoot:latest
      # Explicit, because Kubernetes defaults an implicit `:latest` tag to
      # Always -- meaning every `make kubevirt-reset` would re-pull from
      # Docker Hub live, even with the image already cached from a previous
      # pull. Same fix as phase2-container-lab/attack/netshoot.yaml, same
      # reason (measured 2026-09-25: a TLS handshake timeout to Docker Hub
      # took down a rehearsal).
      imagePullPolicy: IfNotPresent
      command: ["sleep", "infinity"]
