# PHASE 3 -- DRAFT / UNVALIDATED
#
# Cilium Gateway API ingress for the VM. The Gateway gets a LoadBalancer IP
# from the CiliumLoadBalancerIPPool created in scripts/25-cilium-lb-ipam.sh
# (10.1.1.240-249) and Cilium's L2 announcement makes it ARP-reachable from
# the room.
#
# NOTE FOR ANYONE COMPARING AGAINST THE ORIGINAL NOTES: the reference lab ran
# on Kind and its gateway answered on 172.18.255.200. That address is a Docker
# bridge IP and does not exist here. Read the real one out of the Gateway
# status at run time -- LAB_GUIDE.md exports it as $GATEWAY.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nginx-gw
  namespace: kubevirt-demo
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nginx-route
  namespace: kubevirt-demo
spec:
  parentRefs:
    - name: nginx-gw
  rules:
    # One prefix rule for everything. The access decision for /secret is NOT
    # made here -- it is made by the CiliumNetworkPolicy in 50-cnp-l7.yaml.
    # Doing it in the route would prove nothing about eBPF; the whole point is
    # that the enforcement lives in the datapath, below the ingress layer.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nginx
          port: 80
